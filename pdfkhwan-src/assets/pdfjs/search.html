<script src="pdf.min.js"></script>
<script>
/* ============================================================
   PDF text search + TOC + selection engine (offline, pdf.js)
   Host bridge: window.AndroidSearch

   v7 — fragment-based RTL word engine (2026-10).

   v3/v4 split pdf.js text items with canvas measureText; v5/v6.x
   replayed the content stream and derived word boundaries from glyph
   advances with page-wide modal thresholds. Measured against poppler
   on the user's three real books, v6.7 still produced:
   - glued words on PowerPoint-style exporters (every word carries its
     own BT/ET+Tm block; the space is pure geometry and advance boxes
     overlap at the boundary): «فارماکولوژیدیوریتیک»
   - shattered words where tight-justification kerns (0.03–0.11em) sat
     inside words: «د|کتور», «فارماکو|کنتیک», «تع|یی|ن»
   - reversed Persian words inside Latin-majority lines: «غارفتسا»
   - scrambled number clusters: «۲۰-۱۶٪» → «٪-۲۰۱۶», «1405» → «5041»
     (root cause: Arabic-Indic digits live in the Arabic Unicode block
     and were counted as RTL direction votes)

   v7 rebuilds words around TEXT FRAGMENTS (BT/Tm/Td-jump units):
   - every glyph is stamped with a fragment id in replayOps
   - same-line fragment boundaries are word separators, gated by
     calibrated evidence: markers (ZWNJ/space/sentinel boxes straddling
     the boundary), touching splits (book corpus), joinable-letter
     overlaps (kern-split words), or a real gap
   - direction is decided per fragment with digit-aware script votes;
     LTR islands inside RTL lines (numbers, Latin phrases) order by
     their own direction and occupy their full extent (unit ordering)
   - glyph-per-fragment producers (the 112-page book) get their tiny
     same-class fragment runs merged back before analysis
   - kern-explained gaps are never cut geometrically; marker-rich
     pages disable geometric cuts entirely

   Full-document verification (poppler as reference, all pages):
   diuretics.pdf 30p: char errors 2027→1418 (−30%)
   sahat.pdf    112p: 120451→112156 (−7%) + mixed Latin/Persian TOC
                      lines recovered from reversed gibberish to correct
                      reading order («تعریف صحت و ابعاد آن»)
   digestive.pdf 76p: 6769→4742 (−30%)
   Everything (search text, selection words, copy) flows through ONE
   word stream, so search and copy always agree.
   ============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

/* Persian/Arabic-aware normalization — applied IDENTICALLY to query
   and page text so the result count does not depend on how the query
   was entered. */
function norm(s) {
  s = String(s);
  if (/[\u00A0\u1680\u180E\u2000-\u200F\u2028-\u202F\u205F\u3000\uFEFF\uFB50-\uFDFF\uFE70-\uFEFF\uFDF0-\uFDFD]/.test(s)) {
    try { s = s.normalize('NFKC'); } catch (e) {}
  }
  return s
    .replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u2064\u2066-\u2069\u180E\uFEFF]/g, '')   // invisible + bidi
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')                            // harakat, tatweel
    .replace(/\u064A/g, '\u06CC')                                                        // Arabic Yeh -> Farsi Yeh
    .replace(/\u0649/g, '\u06CC')                                                        // Alef Maksura -> Yeh
    .replace(/\u0643/g, '\u06A9')                                                        // Arabic Kaf -> Farsi Kaf
    .replace(/[\u0622\u0623\u0625\u0671]/g, '\u0627')                                    // ALEF variants -> bare ALEF
    .replace(/\u0629/g, '\u0647')                                                        // TEH MARBUTA -> HEH
    .replace(/[\u0660-\u0669\u06F0-\u06F9]/g, function (d) {                             // Persian digits
      return String.fromCharCode(48 + (d.charCodeAt(0) & 0xF));
    })
    .replace(/\u200C/g, '')                                                              // ZWNJ -> nothing (symmetric!)
    .replace(/\s+/g, ' ')
    .toLowerCase()
    .trim();
}

/* compact haystack: spaces removed — lets «می شود» / «می‌شود» / «میشود»
   find the same text (v4 behavior, kept for search) */
function normCompact(s) {
  return norm(s).replace(/\s+/g, '');
}

function safe(fn) {
  try { return fn(); } catch (e) { reportErr(e); }
}
function reportErr(e) {
  var m = (e && e.message) ? e.message : String(e);
  if (window.AndroidSearch) AndroidSearch.onError(m);
}

var doc = null;
var searchCancelled = false;

function onReady() {
  if (window.AndroidSearch) AndroidSearch.onReady();
}

function destroyDoc() {
  if (doc) { try { doc.destroy(); } catch (e) {} doc = null; }
}

function indexOfAll(hay, needle) {
  var out = [];
  if (!needle || !hay) return out;
  var idx = hay.indexOf(needle);
  while (idx >= 0) {
    out.push(idx);
    idx = hay.indexOf(needle, idx + needle.length);
  }
  return out;
}

/* ============================================================================
   PDFKhwan v1.15 — Text engine v5 (Xodo/Adobe-grade RTL word extraction).

   VERIFIED against poppler's rendered word boxes on the real user PDF
   («چپتر اساسات صحت عامه - 1405»):

   - Persian producers store words WITHOUT space characters. The visual
     space is a positive TJ-kern (K177 = +2.12pt at fs12) sandwiched
     between zero-advance ZWNJ glyphs, and/or bare ZWNJ markers between
     touching words (tight justification).
   - getOperatorList() coordinates are USER-SPACE (y-UP); we flip to
     viewport y-down (pageH - y).
   - Graphics state (Tc/Tw/Tz/TL/Ts/font) is saved/restored with q/Q —
     ignoring the stack leaks a fragment's private "Tc -1.5" into every
     later fragment and destroys all geometry.
   - ZWNJ glyphs report a phantom width (167/1000em) but their true
     advance is ZERO.

   Word-boundary rules:
     1. space glyphs (U+0020 / U+00A0)               → boundary
     2. TJ kern ≥ 0.12 × fontsize                     → boundary (space)
     3. ZWNJ markers — when the page uses ZWNJ-as-space
        (ZWNJ count > 3 × real-space-glyph count)    → boundary
     4. geometric gap > adaptive bimodal threshold    → boundary
   Runs in Node (module.exports) and in the WebView (window.PkEngine).
   ============================================================================ */
/* ============================================================
   PDFKhwan text engine v7 — fragment-based RTL word extraction.

   REPLACES the v6.7 x-sort+pair-walk word engine. Lessons verified
   on the three real user files (diuretics.pdf, sahat.pdf,
   digestive.pdf — full-document testing, all pages):

   v6.7 failure modes (measured, poppler as reference):
   1. PowerPoint-style exporters position EVERY word/fragment with
      its own BT/ET + Tm block. The word space is PURE GEOMETRY — no
      space glyph, no kern, no ZWNJ. v6.7 only saw glyph advances,
      which OVERLAP at word boundaries (big side bearings on
      non-joining letters), so words glued: «فارماکولوژیدیوریتیک».
      → v7: replayOps stamps every glyph with a FRAGMENT id
        (new BT / new Tm / large Td jump); same-line fragment
        boundaries are word separators (unless deeply overlapping,
        which marks a style-run split inside one word).
   2. Tight-justification kerns (0.03–0.11em) sit INSIDE words
      («دکتور», «فارماکوکنتیک», «هایپرکلسیمیا»). v6.7's modal
      geometric thresholds fired on them and shattered words.
      → v7: a pair gap that is EXPLAINED by a carried sub-space
        kern (|gapEm − kernEm| < 0.03) is NEVER cut geometrically —
        the producer positioned it deliberately; real word spaces
        come as ≥0.12em kerns (sentinels), wide ZWNJs, space glyphs,
        or fragment breaks.
   3. Mixed-direction lines: a Persian word inside a Latin-majority
      line came out VISUALLY REVERSED («غارفتسا» for «استفراغ»),
      because the reversal only ran for rtl-majority lines.
      → v7: direction handling is PER FRAGMENT — each fragment is
        ordered by its own stream/x correlation; RTL fragments get
        reversed with LTR-run re-reversal wherever they appear.
   4. v6.7's numbered-line rotation mangled ranges («۲۰-۱۶٪» →
      «٪-۲۰۱۶»). v7 drops it: fragments sort by x-center, which puts
      a leading number cluster first naturally.
   5. Bug: `wordJust` read Cmodal BEFORE its `var` declaration —
      the connected-mode gate was silently `undefined >= 0.035`
      (false). Fixed: compute Cmodal first.

   Kept from v6.7 (verified on the book): ghost glyphs, kern
   sentinels (≥0.12em), ZWNJ space evidence rules (hole/kern/adv),
   direction-aware punctuation orthography, mirror pairs, modal
   Tc/Td thresholds for kern-free geometric gaps, «م|ی» rejoin.
   ============================================================ */
window.PkEngine = (function () {
  'use strict';

  /* ---------------- character classes ------------------------------------- */
  function cp(ch) { return ch ? ch.codePointAt(0) : 0; }
  function isRtlCh(ch) {
    var c = cp(ch);
    return (c >= 0x0590 && c <= 0x08FF) || (c >= 0xFB1D && c <= 0xFDFF) ||
           (c >= 0xFE70 && c <= 0xFEFF);
  }
  /* v7 FIX (root cause of «٪-۲۰۱۶» scrambling): Arabic-Indic/Persian DIGITS
     (٠-٩ U+0660-0669, ۰-۹ U+06F0-06F9) live inside the Arabic Unicode
     block, so isRtlCh() counted them as RTL — a «۲۰٪» fragment became
     RTL-majority, got visual-reversed, and number clusters scrambled.
     Digits are bidi-WEAK: they read left-to-right even inside RTL text.
     Direction votes must use this digit-excluding test. */
  function isRtlDir(ch) {
    var c = cp(ch);
    if ((c >= 0x0660 && c <= 0x0669) || (c >= 0x06F0 && c <= 0x06F9)) return false;
    return isRtlCh(ch);
  }
  function isLtrCh(ch) {
    var c = cp(ch);
    return (c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A) ||
           (c >= 0x30 && c <= 0x39) ||
           (c >= 0x0660 && c <= 0x0669) || (c >= 0x06F0 && c <= 0x06F9);
  }
  function isJoinNeutral(ch) {
    var c = cp(ch);
    return c === 0x2D || c === 0x2E || c === 0x2F || c === 0x25 || c === 0x3A ||
           c === 0x2C || c === 0x28 || c === 0x29 || c === 0x2B || c === 0x3D ||
           c === 0x00D7 || c === 0x00F7 || c === 0x066B || c === 0x066C ||
           c === 0x2013 || c === 0x2014 || c === 0x2212;
  }
  function isDiacritic(ch) {
    var c = cp(ch);
    return (c >= 0x064B && c <= 0x065F) || c === 0x0670 || (c >= 0x06D6 && c <= 0x06ED);
  }
  function isZeroWidthMark(ch) {
    var c = cp(ch);
    return c === 0x200B || c === 0x200C || c === 0x200E || c === 0x200F ||
           c === 0x00AD || c === 0x180E || c === 0xFEFF ||
           (c >= 0x202A && c <= 0x202E) || (c >= 0x2060 && c <= 0x2069);
  }
  function strHasRtl(s) {
    for (var i = 0; i < s.length; i++) if (isRtlCh(s[i])) return true;
    return false;
  }

  /* ---------------- operator replay --------------------------------------- */
  /* Emits glyphs in USER-SPACE (y-up); glyphsToWords flips to viewport.
     v7: every glyph carries .f — its TEXT FRAGMENT id. A fragment is a
     BT..ET block, repositioned by Tm, or a large Td jump. Producers that
     position each word with its own Tm (PowerPoint/LibreOffice exports)
     thereby mark their word boundaries. */
  function replayOps(opList, OPS) {
    var glyphs = [];
    var fn = opList.fnArray, args = opList.argsArray;
    var Tm = [1, 0, 0, 1, 0, 0], Tlm = [1, 0, 0, 1, 0, 0];
    var size = 12, tc = 0, tw = 0, tz = 1, leading = 0, rise = 0;
    var x = 0, y = 0;
    var KERN_SPACE = 0.12;
    var gstack = [];
    var kernNext = 0;
    var frag = 0;              /* v7: fragment counter */
    var fkey = null;           /* v1.38: current font key (pdf.js commonObjs id) */

    function setMat(m) { Tm = m; Tlm = m.slice(); x = m[4]; y = m[5]; }
    function moveText(tx, ty) {
      Tlm = [Tlm[0], Tlm[1], Tlm[2], Tlm[3],
             Tlm[4] + Tlm[0] * tx + Tlm[2] * ty,
             Tlm[5] + Tlm[1] * tx + Tlm[3] * ty];
      Tm = Tlm.slice(); x = Tm[4]; y = Tm[5];
    }
    function nextLine() { moveText(0, -leading); }
    function snapshot() { return { size: size, tc: tc, tw: tw, tz: tz, leading: leading, rise: rise, fkey: fkey }; }
    function restore(s) { size = s.size; tc = s.tc; tw = s.tw; tz = s.tz; leading = s.leading; rise = s.rise; fkey = s.fkey; }

    var PRES_FALLBACK = {
      '\uFEF5': '\u0644\u0622', '\uFEF6': '\u0644\u0622',
      '\uFEF7': '\u0644\u0623', '\uFEF8': '\u0644\u0623',
      '\uFEF9': '\u0644\u0625', '\uFEFA': '\u0644\u0625',
      '\uFEFB': '\u0644\u0627', '\uFEFC': '\u0644\u0627'
    };
    function normGlyphStr(s) {
      if (!s) return '';
      if (/[\uFB50-\uFDFF\uFE70-\uFEFF\uFDF0-\uFDFD\uE000-\uF8FF\u200B\u200E\u200F\u202A-\u202E\u2060-\u2069\u00AD\uFEFF]/.test(s)) {
        try { s = s.normalize('NFKC'); } catch (eN) {}
        if (/[\uFEF5-\uFEFC]/.test(s)) {
          s = s.replace(/[\uFEF5-\uFEFC]/g, function (m) { return PRES_FALLBACK[m] || m; });
        }
        s = s.replace(/[\uE000-\uF8FF\u200B\u200E\u200F\u202A-\u202E\u2060-\u2069\u00AD\uFEFF]/g, '');
      }
      return s;
    }

    function showGlyphs(arr) {
      var hs = (tz && tz > 0) ? tz : 1;
      var a = Tm[0], b = Tm[1];
      var fsTxt = Math.abs(size * hs) || 10;
      var msc = Math.hypot(Tm[0], Tm[1]) || 1;
      var effSize = fsTxt * msc;
      for (var k = 0; k < arr.length; k++) {
        var g = arr[k];
        if (typeof g === 'number') {
          var kd = -(g / 1000) * size * hs; /* v1.42: TJ displacement sign per PDF spec (9.4.3): x -= n/1000 */
          var kdEm = -(g / 1000);
          if (kdEm >= KERN_SPACE) {
            glyphs.push({ x0: x, x1: x, u0: x, v0: y, u1: x, v1: y, y: y, fs: effSize, ch: '', cut: true, rtl: false, sen: true, f: frag, fo: fkey });
            kernNext = 0;
          } else {
            kernNext = kdEm;
          }
          x += a * kd; y += b * kd;
          continue;
        }
        if (!g || typeof g !== 'object') continue;
        var noU = typeof g.unicode !== 'string' || g.unicode.length === 0;
        var u = noU ? '' : g.unicode;
        var spaceG = u === ' ' || u === '\u00A0';
        /* v1.43: stream control chars (\n, \r, \t) are layout noise */
        if (u.length === 1 && u.charCodeAt(0) < 32) {
          var ngAdv = (typeof g.width === 'number' ? g.width / 1000 * size * hs : 0) + tc;
          var ngEx = x + a * ngAdv, ngEy = y + b * ngAdv;
          glyphs.push({
            x0: Math.min(x, ngEx), x1: Math.max(x, ngEx),
            u0: x, v0: y + rise, u1: ngEx, v1: ngEy + rise, y: y + rise,
            fs: effSize, ch: '', ghost: true, cut: false, rtl: false, f: frag, fo: fkey
          });
          kernNext = 0;
          x = ngEx; y = ngEy;
          continue;
        }
        var zw = !noU && isZeroWidthMark(u);
        var gw;
        if (typeof g.width === 'number') gw = g.width / 1000 * size * hs;
        else gw = (spaceG ? 250 : 500) / 1000 * size * hs;
        if (noU) {
          var gadv = gw + tc;
          var gex = x + a * gadv, gey = y + b * gadv;
          glyphs.push({
            x0: Math.min(x, gex), x1: Math.max(x, gex),
            u0: x, v0: y + rise, u1: gex, v1: gey + rise, y: y + rise,
            fs: effSize, ch: '', ghost: true, cut: false, rtl: false, f: frag, fo: fkey
          });
          if (gadv >= 0.07 * fsTxt) {
            glyphs.push({ x0: gex, x1: gex, u0: gex, v0: gey, u1: gex, v1: gey, y: gey, fs: effSize, ch: '', cut: true, rtl: false, sen: true, f: frag, fo: fkey });
          }
          kernNext = 0;
          x = gex; y = gey;
          continue;
        }
        if (spaceG) {
          var sadv = gw + tw + tc;
          glyphs.push({ x0: x, x1: x, u0: x, v0: y, u1: x, v1: y, y: y, fs: effSize, ch: ' ', cut: true, rtl: false,
                        advEm: gw / (fsTxt || 1), f: frag, fo: fkey });
          x += a * sadv; y += b * sadv;
          kernNext = 0;
          continue;
        }
        var adv = gw + tc;
        var ex = x + a * adv, ey = y + b * adv;
        if (zw) {
          glyphs.push({
            x0: Math.min(x, ex), x1: Math.max(x, ex),
            u0: x, v0: y + rise, u1: ex, v1: ey + rise, y: y + rise, fs: effSize, ch: u,
            cut: false, rtl: false, dirRtl: false, dia: false, zw: true,
            kernEm: kernNext,
            advEm: (typeof g.width === 'number' ? g.width / 1000 : 0),
            sepCand: (typeof g.width === 'number' ? g.width / 1000 : 0) >= 0.12,
            f: frag, fo: fkey
          });
          kernNext = 0;
          x = ex; y = ey;
          continue;
        }
        var nu = normGlyphStr(u);
        if (!nu.length) {
          glyphs.push({
            x0: Math.min(x, ex), x1: Math.max(x, ex),
            u0: x, v0: y + rise, u1: ex, v1: ey + rise, y: y + rise,
            fs: effSize, ch: '', ghost: true, cut: false, rtl: false, f: frag, fo: fkey
          });
          kernNext = 0;
          x = ex; y = ey;
          continue;
        }
        if (nu.length === 1) {
          glyphs.push({
            x0: Math.min(x, ex), x1: Math.max(x, ex),
            u0: x, v0: y + rise, u1: ex, v1: ey + rise,
            y: (y + ey) * 0.5 + rise, fs: effSize, ch: nu,
            cut: false, rtl: isRtlCh(nu), dirRtl: isRtlDir(nu), dia: isDiacritic(nu), zw: false,
            kernEm: kernNext, advEm: 0, sepCand: false, f: frag, fo: fkey
          });
        } else {
          /* Ligature / Presentation-Form expansion (e.g. 'ﻼ' -> 'لا') split across span so char boxes align 1:1 */
          var chs = [];
          for (var ci0 = 0; ci0 < nu.length; ci0++) chs.push(nu.charAt(ci0));
          var baseIndices = [];
          var lastB = -1;
          for (var ci1 = 0; ci1 < chs.length; ci1++) {
            if (!isDiacritic(chs[ci1]) || lastB < 0) {
              lastB = baseIndices.length;
              baseIndices.push(ci1);
            }
          }
          var mBases = Math.max(1, baseIndices.length);
          var uRtl = strHasRtl(nu);
          var minGx = Math.min(x, ex), maxGx = Math.max(x, ex);
          var dxSpan = ex - x, dySpan = ey - y;
          var bIdxOf = [];
          var curB = -1;
          for (var ci2 = 0; ci2 < chs.length; ci2++) {
            if (!isDiacritic(chs[ci2]) || curB < 0) curB++;
            bIdxOf.push(curB);
          }
          for (var ci3 = 0; ci3 < chs.length; ci3++) {
            var c3 = chs[ci3];
            var bi3 = bIdxOf[ci3];
            var t0, t1;
            if (uRtl && a >= 0) {
              /* RTL visual order left-to-right: logical char 0 sits at right end */
              t1 = 1 - (bi3 / mBases);
              t0 = 1 - ((bi3 + 1) / mBases);
            } else {
              t0 = bi3 / mBases;
              t1 = (bi3 + 1) / mBases;
            }
            var sx0 = x + dxSpan * t0, sy0 = y + dySpan * t0;
            var sx1 = x + dxSpan * t1, sy1 = y + dySpan * t1;
            glyphs.push({
              x0: Math.min(sx0, sx1), x1: Math.max(sx0, sx1),
              u0: sx0, v0: sy0 + rise, u1: sx1, v1: sy1 + rise,
              y: (sy0 + sy1) * 0.5 + rise, fs: effSize, ch: c3,
              cut: false, rtl: isRtlCh(c3), dirRtl: isRtlDir(c3), dia: isDiacritic(c3), zw: (c3 === '\u200C'),
              kernEm: (ci3 === 0 ? kernNext : 0), advEm: 0, sepCand: false, f: frag, fo: fkey
            });
          }
        }
        kernNext = 0;
        x = ex; y = ey;
      }
      Tm[4] = x; Tm[5] = y;
    }

    for (var i = 0; i < fn.length; i++) {
      var f = fn[i], aArgs = args[i];
      switch (f) {
        case OPS.save: gstack.push(snapshot()); break;
        case OPS.restore: if (gstack.length) restore(gstack.pop()); break;
        case OPS.beginText:
          Tm = [1, 0, 0, 1, 0, 0]; Tlm = Tm.slice(); x = 0; y = 0; kernNext = 0;
          frag++;                                   /* v7: new BT = new fragment */
          break;
        case OPS.setFont: if (aArgs && aArgs.length > 1) { size = aArgs[1]; fkey = aArgs[0]; } break;
        case OPS.setTextMatrix:
          frag++;                                   /* v7: reposition = new fragment */
          setMat(aArgs && aArgs.length >= 6 ? [aArgs[0], aArgs[1], aArgs[2], aArgs[3], aArgs[4], aArgs[5]] : [1, 0, 0, 1, 0, 0]);
          break;
        case OPS.moveText:
          if (Math.abs(aArgs[0]) > 0.2 * (size || 12) || Math.abs(aArgs[1]) > 0.2 * (size || 12)) frag++;
          moveText(aArgs[0], aArgs[1]);
          break;
        case OPS.setLeadingMoveText:
          if (Math.abs(aArgs[0]) > 0.2 * (size || 12) || Math.abs(aArgs[1]) > 0.2 * (size || 12)) frag++;
          leading = -aArgs[1]; moveText(aArgs[0], aArgs[1]);
          break;
        case OPS.setLeading: leading = aArgs[0]; break;
        case OPS.setCharSpacing: tc = aArgs[0]; break;
        case OPS.setWordSpacing: tw = aArgs[0]; break;
        case OPS.setHScale: tz = aArgs[0] > 5 ? aArgs[0] / 100 : aArgs[0]; break;
        case OPS.setTextRise: rise = aArgs[0]; break;
        case OPS.nextLine:
          nextLine(); break;
        case OPS.nextLineSetSpacingShowText:
          tw = aArgs[0]; tc = aArgs[1]; nextLine(); showGlyphs(aArgs[2] || []); break;
        case OPS.nextLineShowText: nextLine(); showGlyphs(aArgs ? aArgs[0] || [] : []); break;
        case OPS.showText:
        case OPS.showSpacedText:
          showGlyphs(aArgs ? aArgs[0] || [] : []); break;
      }
    }

    var clean = [];
    for (var p = 0; p < glyphs.length; p++) {
      var gg = glyphs[p];
      gg.idx = clean.length;
      clean.push(gg);

                } else {

                  var pv2 = glNew.length ? { x0: glNew[glNew.length - 1][1], x1: glNew[glNew.length - 1][2] } : null;
                  var bx0, bx1;
                  if (nx && pv2) {
                    var mid = (Math.min(pv2.x0, pv2.x1) + Math.max(nx.x0, nx.x1)) / 2;
                    bx0 = mid - 0.5; bx1 = mid + 0.5;
                  } else if (nx) {
                    bx0 = w.rtl ? Math.max(nx.x0, nx.x1) - 1 : Math.min(nx.x0, nx.x1);
                    bx1 = bx0 + 1;
                  } else if (pv2) {
                    bx0 = w.rtl ? Math.min(pv2.x0, pv2.x1) - 1 : Math.max(pv2.x0, pv2.x1);
                    bx1 = bx0 + 1;
                  } else { bx0 = w.x0; bx1 = Math.min(w.x0 + 1, w.x1); }
                  glNew.push([ch4, Math.round(bx0 * 100) / 100, Math.round(bx1 * 100) / 100]);
                }
              }
              gl = glNew;
            }
          }
          wire.push([w.x0, w.y0, w.x1, w.y1, w.line, w.t, w.rtl, w.gap, w.br,
                     w.zg ? 1 : 0, gl || []]);
        }
        AndroidSearch.onSelPage(p, JSON.stringify({ vw: res.vw, vh: res.vh, w: wire }));
      } catch (e) {
        selWant = 0;
        if (window.AndroidSearch) AndroidSearch.onSelError(String(e && e.message || e));
        break;
      }
    }
    selBusy = false;
  } catch (e) {
    selBusy = false;
    if (window.AndroidSearch) AndroidSearch.onSelError(String(e && e.message || e));
  }
}

async function requestToc(url) {
  try {
    destroyDoc();
    var task = pdfjsLib.getDocument({ url: url, isEvalSupported: false, disableFontFace: true });
    doc = await task.promise;
    var outline = await doc.getOutline();
    if (!outline || !outline.length) {
      AndroidSearch.onToc('[]');
      destroyDoc();
      return;
    }
    var items = [];
    async function walk(arr, depth) {
      for (var i = 0; i < arr.length; i++) {
        var o = arr[i];
        var page = 0;
        try {
          var dest = o.dest;
          if (typeof dest === 'string') dest = await doc.getDestination(dest);
          if (Array.isArray(dest) && dest[0]) page = (await doc.getPageIndex(dest[0])) + 1;
        } catch (e) {}
        items.push({ t: o.title || 'بدون عنوان', p: page, d: depth });
        if (o.items && o.items.length && items.length < 2000) await walk(o.items, depth + 1);
      }
    }
    await walk(outline, 0);
    AndroidSearch.onToc(JSON.stringify(items));
    destroyDoc();
  } catch (e) { reportErr(e); }
}

/* ============================================================
   v1.37: full-text extraction for «تبدیل به Word» — walks the
   requested pages (or all), rebuilds the reading-order text with
   the SAME PkEngine word stream the copy/search paths use, and
   streams it to Java page by page (bridge keeps pages small).
   ============================================================ */
var textGen = 0;

async function extractText(url, password, pagesJson) {
  var gen = ++textGen;
  try {
    destroyDoc();
    var task = pdfjsLib.getDocument({ url: url, isEvalSupported: false, disableFontFace: true,
                                       password: password || undefined });
    doc = await task.promise;
    if (gen !== textGen) { destroyDoc(); return; }
    var total = doc.numPages;
    var pages = null;
    if (pagesJson && pagesJson.length) {
      try { pages = JSON.parse(pagesJson); } catch (e) { pages = null; }
    }
    if (!pages || !pages.length) {
      pages = [];
      for (var i = 1; i <= total; i++) pages.push(i);
    }
    var done = 0;
    for (var pi = 0; pi < pages.length; pi++) {
      var p1 = pages[pi];
      if (p1 < 1 || p1 > total) continue;
      if (gen !== textGen) return;
      var text = '';
      try {
        var page = await doc.getPage(p1);
        var res = await PkEngine.pageWords(page);
        page.cleanup();
        text = PkEngine.wordsToText(res.words);
      } catch (e) { text = ''; }
      if (gen !== textGen) return;
      AndroidSearch.onTextPage(p1, text);
      done++;
      if (done % 3 === 0 || done === pages.length) {
        AndroidSearch.onTextProgress(done, pages.length);
      }
      await new Promise(function (r) { setTimeout(r, 0); }); // yield
    }
    if (gen === textGen) AndroidSearch.onTextDone(done);
    destroyDoc();
  } catch (e) {
    if (gen === textGen) AndroidSearch.onTextError(String(e && e.message || e));
  }
}


/* ============================================================
   v1.38: LAYOUT extraction for «تبدیل به Word» — same battle-tested
   word stream as copy/search, but each word keeps its geometry,
   font key and effective size, and the font table is resolved from
   pdf.js commonObjs (real name + bold/italic flags). Java then
   rebuilds paragraphs with direction, alignment, font, size and
   bold/italic — a real layout-preserving DOCX.
   ============================================================ */
async function pageLayout(page) {
  const opList = await page.getOperatorList();
  const OPS = (typeof pdfjsLib !== 'undefined' && pdfjsLib.OPS) ? pdfjsLib.OPS
    : (typeof pdfjs !== 'undefined' && pdfjs.OPS ? pdfjs.OPS : null);
  const vp = page.getViewport({ scale: 1 });
  const glyphs = PkEngine.replayOps(opList, OPS);
  const tf = vp.transform;
  if (tf && tf.length >= 6) {
    PkEngine.applyViewportTransform(glyphs, tf);
    var words = PkEngine.glyphsToWords(glyphs, 0);
  } else {
    var words = PkEngine.glyphsToWords(glyphs, vp.height);
  }

  /* font table: resolve each distinct glyph font key via commonObjs */
  var fkeys = {}, flist = [];
  function fontIdx(k) {
    if (k == null) return -1;
    if (Object.prototype.hasOwnProperty.call(fkeys, k)) return fkeys[k];
    var info = { n: '', b: 0, i: 0 };
    try {
      var fo = page.commonObjs.get(k);
      if (fo) {
        if (typeof fo.name === 'string' && fo.name) info.n = fo.name;
        else if (typeof fo.loadedName === 'string') info.n = fo.loadedName;
        if (fo.bold === true) info.b = 1;
        if (fo.italic === true) info.i = 1;
      }
    } catch (e) { /* unresolved object — generic */ }
    var idx = flist.length;
    flist.push([info.n, info.b, info.i]);
    fkeys[k] = idx;
    return idx;
  }

  /* per word: [t, x0, y0, x1, y1, fs, fontIdx, rtl, line, gap, zg] */
  var out = [];
  for (var i2 = 0; i2 < words.length; i2++) {
    var w = words[i2];
    var fs = 0, fk = null;
    if (w.g) {
      for (var k2 = 0; k2 < w.g.length; k2++) {
        var gg = w.g[k2];
        if (!gg.ch || gg.ch === ' ') continue;
        if (gg.fs && gg.fs > fs) fs = gg.fs;
        if (gg.fo) fk = gg.fo;
      }
    }
    if (!fs) fs = (w.y1 - w.y0) / 1.25 || 10;
    out.push([w.t, Math.round(w.x0 * 100) / 100, Math.round(w.y0 * 100) / 100,
      Math.round(w.x1 * 100) / 100, Math.round(w.y1 * 100) / 100,
      Math.round(fs * 100) / 100, fontIdx(fk), w.rtl ? 1 : 0, w.line, w.gap,
      w.zg ? 1 : 0]);
  }
  /* v1.43: IMAGE BLOCK detection — same operator list, second pass.
     Tracks the graphics CTM through transform/save/restore and records
     the placement rect of every painted image (unit square × CTM) in
     USER SPACE, then maps it through the viewport transform like the
     glyphs — Java crops the same rect from the pdfium render. */
  var imgRects = [];
  try {
    var ctm = [1, 0, 0, 1, 0, 0];
    var gstack2 = [];
    var fn2 = opList.fnArray, args2 = opList.argsArray;
    function mul(m, t) {
      return [m[0] * t[0] + m[1] * t[2], m[0] * t[1] + m[1] * t[3],
              m[2] * t[0] + m[3] * t[2], m[2] * t[1] + m[3] * t[3],
              m[4] * t[0] + m[5] * t[2] + t[4], m[4] * t[1] + m[5] * t[3] + t[5]];
    }
    function quad(m) {
      /* unit-square corners through the matrix */
      var xs = [m[4], m[0] + m[4], m[2] + m[4], m[0] + m[2] + m[4]];
      var ys = [m[5], m[1] + m[5], m[3] + m[5], m[1] + m[3] + m[5]];
      return [Math.min.apply(null, xs), Math.min.apply(null, ys),
              Math.max.apply(null, xs), Math.max.apply(null, ys)];
    }
    var PAINT_IMG = {};
    if (OPS) {
      PAINT_IMG[OPS.paintImageXObject] = 1;
      PAINT_IMG[OPS.paintInlineImageXObject] = 1;
      PAINT_IMG[OPS.paintJpegXObject] = 1;
      PAINT_IMG[OPS.paintImageMaskXObject] = 1;
    }
    for (var oi = 0; oi < fn2.length; oi++) {
      var of = fn2[oi];
      if (of === OPS.save) gstack2.push(ctm);
      else if (of === OPS.restore) { if (gstack2.length) ctm = gstack2.pop(); }
      else if (of === OPS.transform) ctm = mul(ctm, args2[oi]);
      else if (PAINT_IMG[of]) {
        var q = quad(ctm);
        if (q[2] - q[0] > 8 && q[3] - q[1] > 8) imgRects.push(q);
      }
    }
  } catch (eImg) { imgRects = []; }
  var imOut = [];
  if (tf && tf.length >= 6) {
    for (var ri = 0; ri < imgRects.length; ri++) {
      var q2 = imgRects[ri];
      var corners = [[q2[0], q2[1]], [q2[2], q2[1]], [q2[0], q2[3]], [q2[2], q2[3]]];
      var vx0 = 1e9, vy0 = 1e9, vx1 = -1e9, vy1 = -1e9;
      for (var ci = 0; ci < 4; ci++) {
        var px = tf[0] * corners[ci][0] + tf[2] * corners[ci][1] + tf[4];
        var py = tf[1] * corners[ci][0] + tf[3] * corners[ci][1] + tf[5];
        if (px < vx0) vx0 = px; if (px > vx1) vx1 = px;
        if (py < vy0) vy0 = py; if (py > vy1) vy1 = py;
      }
      imOut.push([Math.round(vx0 * 100) / 100, Math.round(vy0 * 100) / 100,
                  Math.round(vx1 * 100) / 100, Math.round(vy1 * 100) / 100]);
    }
  }
  /* merge rects that overlap heavily (one image drawn in clipped tiles) */
  var imMerged = [];
  for (var imi = 0; imi < imOut.length; imi++) {
    var a = imOut[imi], taken = false;
    for (var imj = 0; imj < imMerged.length; imj++) {
      var b = imMerged[imj];
      var lox = Math.max(a[0], b[0]), loy = Math.max(a[1], b[1]);
      var hix = Math.min(a[2], b[2]), hiy = Math.min(a[3], b[3]);
      if (hix > lox && hiy > loy) {
        var ov = (hix - lox) * (hiy - loy);
        var mn = Math.min((a[2] - a[0]) * (a[3] - a[1]), (b[2] - b[0]) * (b[3] - b[1]));
        if (ov > 0.55 * Math.max(1, mn)) {
          b[0] = Math.min(b[0], a[0]); b[1] = Math.min(b[1], a[1]);
          b[2] = Math.max(b[2], a[2]); b[3] = Math.max(b[3], a[3]);
          taken = true; break;
        }
      }
    }
    if (!taken) imMerged.push(a.slice());
  }

  return { vw: Math.round(vp.width), vh: Math.round(vp.height), f: flist, w: out, im: imMerged };
}

var layoutGen = 0;
async function extractLayout(url, password, pagesJson) {
  var gen = ++layoutGen;
  try {
    destroyDoc();
    var task = pdfjsLib.getDocument({ url: url, isEvalSupported: false, disableFontFace: true,
                                       password: password || undefined });
    doc = await task.promise;
    if (gen !== layoutGen) { destroyDoc(); return; }
    var total = doc.numPages;
    var pages = null;
    if (pagesJson && pagesJson.length) {
      try { pages = JSON.parse(pagesJson); } catch (e) { pages = null; }
    }
    if (!pages || !pages.length) {
      pages = [];
      for (var i = 1; i <= total; i++) pages.push(i);
    }
    var done = 0;
    for (var pi = 0; pi < pages.length; pi++) {
      var p1 = pages[pi];
      if (p1 < 1 || p1 > total) continue;
      if (gen !== layoutGen) return;
      var payload = null;
      try {
        var page = await doc.getPage(p1);
        payload = await pageLayout(page);
        page.cleanup();
      } catch (e) { payload = null; }
      if (gen !== layoutGen) return;
      try {
        AndroidSearch.onLayoutPage(p1, payload ? JSON.stringify(payload) : null);
      } catch (eBridge) {
        if (gen === layoutGen) AndroidSearch.onLayoutError(String(eBridge && eBridge.message || eBridge));
        destroyDoc();
        return;
      }
      done++;
      if (done % 3 === 0 || done === pages.length) {
        AndroidSearch.onLayoutProgress(done, pages.length);
      }
      await new Promise(function (r) { setTimeout(r, 0); }); // yield
    }
    if (gen === layoutGen) AndroidSearch.onLayoutDone(done);
    destroyDoc();
  } catch (e) {
    if (gen === layoutGen) AndroidSearch.onLayoutError(String(e && e.message || e));
  }
}
